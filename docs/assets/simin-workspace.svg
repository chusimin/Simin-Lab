<g><circle cx="57" cy="97" r="5" fill="#e7b1ae"/><circle cx="74" cy="97" r="5" fill="#e8d8ad"/><circle cx="91" cy="97" r="5" fill="#b7d7bb"/></g>
<path d="M65 136l3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#18181b"/>
<text x="87" y="156" fill="#18181b" font-size="21" font-weight="600">Simin</text>
<g font-size="13" fill="#737378">
<text x="64" y="208">Home</text><text x="64" y="244">Documents</text><text x="64" y="280">Discussion starters</text><text x="64" y="316">Trash</text>
<text x="61" y="367" font-size="10" letter-spacing="1.1" fill="#a1a1a6">CURRENT PROJECT</text>
</g>
<rect x="48" y="382" width="169" height="36" rx="7" fill="#ededed"/><text x="62" y="405" fill="#18181b" font-size="13">Travel planner</text>
<g transform="translate(63 449)"><path d="M0 8q0-8 8-8h35l10 12h75q8 0 8 8v65q0 12-12 12H12Q0 97 0 85z" fill="#29292c"/>
<rect x="16" y="10" width="95" height="65" rx="5" fill="#fff" stroke="#e4e4e7"/><text x="25" y="28" font-size="11" font-weight="600" fill="#18181b">Travel</text><text x="25" y="44" font-size="11" font-weight="600" fill="#18181b">planner</text><path d="M25 54h65m-65 6h46" stroke="#e4e4e7"/>
<path d="M0 30q0-8 8-8h35l10 12h75q8 0 8 8v43q0 12-12 12H12Q0 97 0 85z" fill="url(#glass)" stroke="#c4c4c7" stroke-width=".6"/>
</g>
<text x="64" y="643" font-size="12" fill="#737378">Settings</text>
<g stroke="#e9e9eb" stroke-width="1"><path d="M230 76v598M768 76v598M230 133h934M248 217h173"/></g>
<text x="251" y="110" font-size="12" fill="#99999e">Projects</text><text x="305" y="110" font-size="12" fill="#99999e">/</text><text x="321" y="110" font-size="12" fill="#18181b">Travel planner</text>
<text x="251" y="165" font-size="11" fill="#88888d">DOCUMENTS</text><text x="410" y="165" font-size="20" fill="#18181b">+</text>
<rect x="245" y="178" width="178" height="31" rx="5" fill="#f4f4f5"/>
<text x="256" y="198" font-size="12" fill="#18181b">Problem.md</text><text x="256" y="240" font-size="12" fill="#737378">Research.md</text>
<path d="M438 151v503" stroke="#eeeef0"/>
<text x="464" y="169" fill="#929297" font-size="10">MARKDOWN</text>
<text x="464" y="218" font-size="24" fill="#18181b" font-weight="600">Problem definition</text>
<text x="464" y="252" font-size="11" fill="#a1a1a6">Travel planner · Confirmed notes</text>
<text x="464" y="301" font-size="15" fill="#18181b" font-weight="600">Who needs this?</text>
<g font-size="12" fill="#66666c"><text x="464" y="330">People planning a short trip together.</text><text x="464" y="353">They need one shared, realistic itinerary.</text></g>
<text x="464" y="397" font-size="15" fill="#18181b" font-weight="600">What do we know?</text>
<circle cx="468" cy="424" r="2" fill="#737378"/><text x="480" y="429" font-size="12" fill="#66666c">Plans are scattered across messages.</text>
<circle cx="468" cy="448" r="2" fill="#737378"/><text x="480" y="453" font-size="12" fill="#66666c">Budget and travel time affect decisions.</text>
<path d="M464 481h278" stroke="#e9e9eb"/>
<text x="464" y="515" font-size="15" fill="#18181b" font-weight="600">Questions to verify</text>
<text x="464" y="545" font-size="12" fill="#66666c">Which part of planning causes the delay?</text>
<text x="464" y="569" font-size="12" fill="#66666c">What would make the first plan useful?</text>
<text x="789" y="111" font-size="11" fill="#929297">Existing Agent conversation</text>
<rect x="854" y="165" width="287" height="69" rx="12" fill="#f4f4f5"/>
<g fill="#424247" font-size="12"><text x="870" y="192">Help me clarify the problem before</text><text x="870" y="212">we decide what to build.</text></g>
<path d="M800 262l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#18181b"/>
<g fill="#55555c" font-size="12"><text x="789" y="306">Let’s start with a real example.</text><text x="789" y="336">Who was planning the trip, and where</text><text x="789" y="356">did the process get stuck?</text></g>
<path d="M789 393h352" stroke="#e9e9eb"/>
<text x="789" y="423" font-size="11" fill="#929297">PROPOSED FILE CHANGE</text><text x="789" y="450" font-size="13" fill="#18181b" font-weight="600">Problem.md</text>
<text x="789" y="475" font-size="12" fill="#737378">Review the confirmed notes before saving.</text>
<rect x="789" y="497" width="119" height="30" rx="7" fill="#18181b"/><text x="848" y="516" text-anchor="middle" font-size="11" fill="#fff">Review changes</text>
<rect x="786" y="573" width="357" height="79" rx="12" fill="#fff" stroke="#dedee1"/>
<text x="803" y="598" font-size="12" fill="#a1a1a6">Continue the discussion…</text>
<text x="803" y="634" font-size="10" fill="#a1a1a6">Skills</text><rect x="1102" y="616" width="27" height="27" rx="8" fill="#18181b"/><path d="M1115.5 634v-10m-4 4 4-4 4 4" fill="none" stroke="#fff" stroke-width="1.5"/>
</g>
