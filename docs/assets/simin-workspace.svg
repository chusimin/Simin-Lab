<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Simin Lab · a project workspace</title>
<desc id="desc">Illustrated interface with a project document list, a Markdown reading pane, and an Agent conversation. The sample project is a travel planner.</desc>
<defs>
  <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".58"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#18181b" flood-opacity=".09"/></filter>
</defs>
<rect width="1200" height="720" fill="#f5f5f4"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<text x="42" y="45" fill="#18181b" font-size="16" font-weight="600">Simin Lab</text><text x="1158" y="45" text-anchor="end" fill="#86868b" font-size="12" letter-spacing="1.4">AI PM WORKBENCH · ILLUSTRATION</text>
<g filter="url(#shadow)"><rect x="36" y="76" width="1128" height="598" rx="15" fill="#fff" stroke="#e5e5e4"/></g>
