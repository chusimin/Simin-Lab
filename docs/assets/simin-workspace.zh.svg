<text x="464" y="169" fill="#929297" font-size="10">MARKDOWN</text>
<text x="464" y="218" font-size="24" fill="#18181b" font-weight="600">问题定义</text>
<text x="464" y="252" font-size="11" fill="#a1a1a6">旅行计划助手 · 已确认的记录</text>
<text x="464" y="301" font-size="15" fill="#18181b" font-weight="600">谁需要它？</text>
<g font-size="12" fill="#66666c"><text x="464" y="330">需要一起规划短途旅行的人。</text><text x="464" y="353">他们需要一份共同可用的行程。</text></g>
<text x="464" y="397" font-size="15" fill="#18181b" font-weight="600">我们知道什么？</text>
<circle cx="468" cy="424" r="2" fill="#737378"/><text x="480" y="429" font-size="12" fill="#66666c">行程信息散落在聊天消息中。</text>
<circle cx="468" cy="448" r="2" fill="#737378"/><text x="480" y="453" font-size="12" fill="#66666c">预算和交通时间会影响决定。</text>
<path d="M464 481h278" stroke="#e9e9eb"/>
<text x="464" y="515" font-size="15" fill="#18181b" font-weight="600">待验证的问题</text>
<text x="464" y="545" font-size="12" fill="#66666c">规划的哪个环节最容易卡住？</text>
<text x="464" y="569" font-size="12" fill="#66666c">什么结果能让第一份计划有用？</text>
<text x="789" y="111" font-size="11" fill="#929297">现有 Agent 对话</text>
<rect x="854" y="165" width="287" height="69" rx="12" fill="#f4f4f5"/>
<g fill="#424247" font-size="12"><text x="870" y="192">先一起把这个问题聊清楚，</text><text x="870" y="212">再决定应该做什么。</text></g>
<path d="M800 262l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#18181b"/>
<g fill="#55555c" font-size="12"><text x="789" y="306">我们先从一个真实案例开始。</text><text x="789" y="336">当时是谁在计划旅行，</text><text x="789" y="356">过程卡在了哪一步？</text></g>
<path d="M789 393h352" stroke="#e9e9eb"/>
<text x="789" y="423" font-size="11" fill="#929297">拟写入的文件修改</text><text x="789" y="450" font-size="13" fill="#18181b" font-weight="600">问题定义.md</text>
<text x="789" y="475" font-size="12" fill="#737378">保存前，请审阅已经确认的内容。</text>
