<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="825" viewBox="0 0 1440 825" role="img" aria-labelledby="title desc"><title id="title">桌面应用启动路径</title><desc id="desc">本机有桌面应用时双击；公开仓库目前提供源码，需安装依赖和构建。两条路径都要配置自己的模型服务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="825" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">打开工作台，再连接你自己的模型</text><text x="64" y="130" font-size="26" fill="#606472" font-weight="400">桌面自动管理本地服务；模型调用需要联网，费用由服务商收取</text><rect x="68" y="202" width="148" height="148" rx="28" fill="#181a21"/><g transform="translate(111 245) scale(1.96875) rotate(0)"><path d="M16 1l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#fff" stroke="#fff" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="248" y="245" font-size="31" fill="#181a21" font-weight="600">本机已有应用</text><text x="248" y="289" font-size="27" fill="#606472" font-weight="400">双击 Simin Lab</text><rect x="248" y="318" width="343" height="38" rx="19" fill="#f4f5f8"/><text x="419.5" y="344" font-size="21" fill="#606472" font-weight="500" text-anchor="middle">系统提示时允许访问文件夹</text><path d="M634 284H772Q800 284 800 312V395H854" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(83 454) scale(3.125) rotate(0)"><rect x="1" y="3" width="30" height="26" rx="4" fill="#181a21"/><path d="M7 10l6 6-6 6M17 22H25" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="248" y="493" font-size="31" fill="#181a21" font-weight="600">第一次从源码使用</text><text x="248" y="535" font-size="25" fill="#606472" font-weight="400">公开仓库当前提供源码</text><circle cx="119" cy="621" r="39" fill="#f4f5f8"/><g transform="translate(100 602) scale(1.1875) rotate(0)"><path d="M16 2V21m-7-7 7 7 7-7M4 23v7H28V23" fill="none" stroke="#181a21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="119" y="697" font-size="23" fill="#181a21" font-weight="500" text-anchor="middle">下载并安装</text><path d="M179 621h70" fill="none" stroke="#9299aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="339" cy="621" r="39" fill="#f4f5f8"/><g transform="translate(320 602) scale(1.1875) rotate(0)"><path d="M18 3Q32-2 31 12L22 20 9 32 1 24 14 12Q12 7 14 3L20 9 25 5Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="339" y="697" font-size="23" fill="#181a21" font-weight="500" text-anchor="middle">构建项目</text><path d="M399 621h70" fill="none" stroke="#9299aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="559" cy="621" r="39" fill="#f4f5f8"/><g transform="translate(540 602) scale(1.1875) rotate(0)"><path d="M16 1V15M8 5C-8 19 10 40 25 27C34 19 28 9 23 5" fill="none" stroke="#181a21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="559" y="697" font-size="23" fill="#181a21" font-weight="500" text-anchor="middle">启动桌面</text><path d="M672 621H800V467H854" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="882" y="224" width="493" hei