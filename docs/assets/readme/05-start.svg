<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="707" viewBox="0 0 1120 707" role="img" aria-labelledby="title desc"><title id="title">怎么启动工作台</title><desc id="desc">本机已有应用可以双击。公开仓库当前提供源码，需准备环境、安装依赖、构建并启动，然后配置模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="707" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="45" font-size="18" fill="#626269" font-weight="400">启动地图</text><text x="48" y="98" font-size="40" fill="#18181b" font-weight="600">已有桌面应用，还是第一次从源码运行？</text><rect x="48" y="142" width="303" height="135" rx="17" fill="#18181b"/><text x="73" y="185" font-size="27" fill="#fff" font-weight="500">本机已有桌面应用</text><text x="73" y="228" font-size="24" fill="#d7d7dd" font-weight="400">双击 Simin Lab</text><rect x="395" y="142" width="677" height="135" rx="17" fill="#f5f5f6"/><text x="421" y="185" font-size="27" fill="#18181b" font-weight="500">第一次使用公开仓库</text><text x="421" y="228" font-size="23" fill="#626269" font-weight="400">当前提供源码，尚无公开的已签名安装包。</text><rect x="395" y="310" width="213" height="95" rx="13" fill="#f5f5f6"/><text x="410" y="344" font-size="24" fill="#18181b" font-weight="500">准备环境</text><text x="410" y="378" font-size="18" fill="#626269" font-weight="400">Node.js 24+、编译工具</text><path d="M613 355h9" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="627" y="310" width="213" height="95" rx="13" fill="#f5f5f6"/><text x="642" y="344" font-size="24" fill="#18181b" font-weight="500">下载与安装</text><text x="642" y="378" font-size="18" fill="#626269" font-weight="400">克隆仓库，安装依赖</text><path d="M845 355h9" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="859" y="310" width="213" height="95" rx="13" fill="#f5f5f6"/><text x="874" y="344" font-size="24" fill="#18181b" font-weight="500">构建与启动</text><text x="874" y="378" font-size="18" fill="#626269" font-weight="400">构建后启动桌面外壳</text><path d="M501 277v23" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M199 277v209h177" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M966 405v42h-232v21" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="471" width="677" height="118" rx="16" fill="#e5ebe7"/><text x="419" y="511" font-size="27" fill="#18181b" font-weight="500">连接自己的模型</text><text x="419" y="550" font-size="21" fill="#18181b" font-weight="400">设置 → 模型与连接 → 打开设置 → 配置服务与凭据</text><text x="48" y="631" font-size="23" fill="#626269" font-weight="400">桌面自动管理本地服务；模型调用需要网络，费用由模型服务商收取。</text><text x="48" y="677" font-size="21" fill="#626269" font-weight="400">macOS 已做本地验证；Windows 与 Linux 尚未验收。</text></g></svg>
