<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="948" viewBox="0 0 1440 948" role="img" aria-labelledby="title desc"><title id="title">围绕当前任务选技能</title><desc id="desc">十个产品方法按任务调用，没有固定阶段；另有十四个开发维护技能和一项助手使用指引。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="948" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">把方法放在手边，按任务选择</text><text x="64" y="130" font-size="26" fill="#606472" font-weight="400">技能是一套工作方法与参考材料，判断仍需要真实证据</text><path d="M589 484C530 484 595 246 535 246" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="274" cy="243" r="30" fill="#edf0fc"/><g transform="translate(259 227) scale(0.9375) rotate(0)"><path d="M5 30V3M6 4H27L23 11 27 18H6" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="323" y="243" font-size="27" fill="#181a21" font-weight="600">启动项目</text><text x="323" y="277" font-size="22" fill="#606472" font-weight="400">对齐目标与起点</text><path d="M589 484C530 484 595 359 535 359" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="274" cy="356" r="30" fill="#edf0fc"/><g transform="translate(259 340) scale(0.9375) rotate(0)"><path d="M8 17C-3 2 29-4 26 12Q25 16 22 18L21 23H11L10 19Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 27H21M14 30H18" fill="none" stroke="#6d7fd5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="323" y="356" font-size="27" fill="#181a21" font-weight="600">定义问题</text><text x="323" y="390" font-size="22" fill="#606472" font-weight="400">查清问题与依据</text><path d="M589 484C530 484 595 472 535 472" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="274" cy="469" r="30" fill="#edf0fc"/><g transform="translate(259 453) scale(0.9375) rotate(0)"><circle cx="16" cy="9" r="7" fill="#6d7fd5"/><path d="M3 30Q2 18 16 18Q30 18 29 30Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="323" y="469" font-size="27" fill="#181a21" font-weight="600">研究用户</text><text x="323" y="503" font-size="22" fill="#606472" font-weight="400">收集真实经历</text><path d="M589 484C530 484 595 585 535 585" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="274" cy="582" r="30" fill="#edf0fc"/><g transform="translate(259 566) scale(0.9375) rotate(0)"><circle cx="12" cy="9" r="6" fill="#6d7fd5"/><circle cx="25" cy="11" r="5" fill="#6d7fd5"/><path d="M1 29Q1 17 12 17Q24 17 24 29ZM25 19Q32 19 32 29H26Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="323" y="582" font-size="27" fill="#181a21" font-weight="600">用户分层</text><text x="323" y="616" font-size="22" fill="#606472" font-weight="400">识别不同用户</text><path d="M589 484C530 484 595 698 535 698" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="274" cy="695" r="30" fill="#edf0fc"/><g transform="translate(259 679) scale(0.9375) rotate(0)"><path d="M16 2L31 10 16 18 1 10ZM2 18l14 8 14-8M2 24l14 8 14-8" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="323" y="695" font-size="27" fill="#181a21" font-weight="600">拆解产品</text><text x="323" y="729" font-size="22" fill="#606472" font-weight="400">用任务看懂产品</text><path d="M851 484C910 484 908 246 968 246" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1006" cy="243" r="30" fill="#edf0fc"/><g transform="translate(991 227) scale(0.9375) rotate(0)"><rect x="2" y="3" width="11" height="26" rx="3" fill="#6d7fd5"/><rect x="19" y="3" width="11" height="26" rx="3" fill="#6d7fd5"/><path d="M5 11H10M5 17H10M22 11H27M22 17H27" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1055" y="243" font-size="27" fill="#181a21" font-weight="600">竞品分析</text><text x="1055" y="277" font-size="22" fill="#606472" font-weight="400">围绕同一任务比较</text><path d="M851 484C910 484 908 359 968 359" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1006" cy="356" r="30" fill="#edf0fc"/><g transform="translate(991 340) scale(0.9375) rotate(0)"><circle cx="4" cy="5" r="2.5" fill="#6d7fd5"/><path d="M11 5H29" fill="none" stroke="#6d7fd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="15" r="2.5" fill="#6d7fd5"/><path d="M11 15H29" fill="none" stroke="#6d7fd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="25" r="2.5" fill="#6d7fd5"/><path d="M11 25H29" fill="none" stroke="#6d7fd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1055" y="356" font-size="27" fill="#181a21" font-weight="600">管理需求</text><text x="1055" y="390" font-size="22" fill="#606472" font-weight="400">整理来源与变化</text><path d="M851 484C910 484 908 472 968 472" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1006" cy="469" r="30" fill="#edf0fc"/><g transform="translate(991 453) scale(0.9375) rotate(0)"><rect x="2" y="3" width="27" height="7" rx="2" fill="#6d7fd5"/><rect x="2" y="13" width="20" height="7" rx="2" fill="#6d7fd5"/><rect x="2" y="23" width="12" height="7" rx="2" fill="#6d7fd5"/></g><text x="1055" y="469" font-size="27" fill="#181a21" font-weight="600">确定范围</text><text x="1055" y="503" font-size="22" fill="#606472" font-weight="400">判断优先级与版本</text><path d="M851 484C910 484 908 585 968 585" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1006" cy="582" r="30" fill="#edf0fc"/><g transform="translate(991 566) scale(0.9375) rotate(0)"><circle cx="5" cy="7" r="4" fill="#6d7fd5"/><circle cx="27" cy="25" r="4" fill="#6d7fd5"/><path d="M9 7H21Q28 7 28 14Q28 20 20 20H12Q6 20 6 26H21" fill="none" stroke="#6d7fd5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1055" y="582" font-size="27" fill="#181a21" font-weight="600">设计旅程</text><text x="1055" y="616" font-size="22" fill="#606472" font-weight="400">安排人和助手的分工</text><path d="M851 484C910 484 908 698 968 698" fill="none" stroke="#e1e4eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1006" cy="695" r="30" fill="#edf0fc"/><g transform="translate(991 679) scale(0.9375) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1055" y="695" font-size="27" fill="#181a21" font-weight="600">编写需求文档</text><text x="1055" y="729" font-size="22" fill="#606472" font-weight="400">汇总并审查要求</text><circle cx="720" cy="484" r="131" fill="#181a21"/><g transform="translate(695 416) scale(1.5625) rotate(0)"><path d="M16 1l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#fff" stroke="#fff" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="720" y="511" font-size="33" fill="#fff" font-weight="500" text-anchor="middle">当前任务</text><text x="720" y="550" font-size="22" fill="#d2d6e4" font-weight="400" text-anchor="middle">需要哪种方法？</text><rect x="64" y="811" width="1312" height="69" rx="10" fill="#f4f5f8"/><g transform="translate(90 831) scale(0.84375) rotate(0)"><path d="M5 4H27Q30 4 30 7V23Q30 26 27 26H13L6 31V26H5Q2 26 2 23V7Q2 4 5 4Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 11H24M9 17H20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="135" y="856" font-size="27" fill="#181a21" font-weight="500">你可以说：用「问题定义」技能，先帮我找出还缺什么证据。</text><text x="720" y="925" font-size="23" fill="#606472" font-weight="400" text-anchor="middle">10 个产品方法  ·  14 个开发维护技能  ·  1 项助手使用指引</text></g></svg>
