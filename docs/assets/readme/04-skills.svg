<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">技能怎么选</title><desc id="desc">十个产品方法按任务选用，另有十四个开发维护技能和一项助手使用指引。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="620" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="45" font-size="18" fill="#626269" font-weight="400">技能地图</text><text x="48" y="98" font-size="40" fill="#18181b" font-weight="600">遇到什么任务，就选什么方法</text><rect x="850" y="61" width="220" height="34" rx="17" fill="#e5ebe7"/><text x="960.0" y="84" font-size="18" fill="#18181b" font-weight="500" text-anchor="middle">10 个产品方法</text><rect x="48" y="148" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="74" cy="176" r="5" fill="#18181b"/><text x="64" y="215" font-size="24" fill="#18181b" font-weight="500">启动项目</text><text x="64" y="250" font-size="18" fill="#626269" font-weight="400">先对齐目标和起点</text><rect x="256" y="148" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="282" cy="176" r="5" fill="#18181b"/><text x="272" y="215" font-size="24" fill="#18181b" font-weight="500">定义问题</text><text x="272" y="250" font-size="18" fill="#626269" font-weight="400">弄清问题与依据</text><rect x="464" y="148" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="490" cy="176" r="5" fill="#18181b"/><text x="480" y="215" font-size="24" fill="#18181b" font-weight="500">研究用户</text><text x="480" y="250" font-size="18" fill="#626269" font-weight="400">收集真实经历</text><rect x="672" y="148" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="698" cy="176" r="5" fill="#18181b"/><text x="688" y="215" font-size="24" fill="#18181b" font-weight="500">用户分层</text><text x="688" y="250" font-size="18" fill="#626269" font-weight="400">识别不同用户</text><rect x="880" y="148" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="906" cy="176" r="5" fill="#18181b"/><text x="896" y="215" font-size="24" fill="#18181b" font-weight="500">拆解产品</text><text x="896" y="250" font-size="18" fill="#626269" font-weight="400">用任务看懂产品</text><rect x="48" y="296" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="74" cy="324" r="5" fill="#18181b"/><text x="64" y="363" font-size="24" fill="#18181b" font-weight="500">竞品分析</text><text x="64" y="398" font-size="18" fill="#626269" font-weight="400">围绕同一任务比较</text><rect x="256" y="296" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="282" cy="324" r="5" fill="#18181b"/><text x="272" y="363" font-size="24" fill="#18181b" font-weight="500">管理需求</text><text x="272" y="398" font-size="18" fill="#626269" font-weight="400">整理来源和变化</text><rect x="464" y="296" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="490" cy="324" r="5" fill="#18181b"/><text x="480" y="363" font-size="24" fill="#18181b" font-weight="500">确定范围</text><text x="480" y="398" font-size="18" fill="#626269" font-weight="400">判断优先级和版本</text><rect x="672" y="296" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="698" cy="324" r="5" fill="#18181b"/><text x="688" y="363" font-size="24" fill="#18181b" font-weight="500">设计旅程</text><text x="688" y="398" font-size="18" fill="#626269" font-weight="400">安排人和 AI 的分工</text><rect x="880" y="296" width="192" height="124" rx="14" fill="#f5f5f6"/><circle cx="906" cy="324" r="5" fill="#18181b"/><text x="896" y="363" font-size="24" fill="#18181b" font-weight="500">编写需求文档</text><text x="896" y="398" font-size="18" fill="#626269" font-weight="400">汇总并审查要求</text><rect x="48" y="459" width="1024" height="64" rx="14" fill="#18181b"/><text x="72" y="500" font-size="25" fill="#fff" font-weight="500">你可以说：用「问题定义」技能，先帮我找出还缺什么证据。</text><text x="48" y="560" font-size="23" fill="#626269" font-weight="400">技能提供工作方法与参考材料；研究结论仍要靠真实证据。</text><text x="48" y="599" font-size="21" fill="#626269" font-weight="400">完整公开：10 个产品方法 ＋ 14 个开发维护技能 ＋ 1 项助手使用指引</text></g></svg>
