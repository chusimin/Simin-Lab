<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Simin 是什么</title><desc id="desc">把产品想法放进一个项目，与助手讨论，确认后留下独立文档。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="610" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="24" y="20" width="1072" height="232" rx="24" fill="#18181b"/><path d="M65 59l4 13 13 4-13 4-4 13-4-13-13-4 13-4Z" stroke="#18181b" stroke-width="0" fill="#fff"/><text x="93" y="86" font-size="24" fill="#fff" font-weight="500">Simin · 产品经理的 AI 工作台</text><text x="56" y="152" font-size="43" fill="#fff" font-weight="600">把想法聊清楚，把判断留下来。</text><text x="56" y="207" font-size="25" fill="#d7d7dd" font-weight="400">一个项目里，集中讨论、证据和确认过的文档。</text><rect x="48" y="280" width="292" height="172" rx="18" fill="#f5f5f6"/><circle cx="82" cy="315" r="21" fill="#18181b"/><text x="82" y="322" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">1</text><text x="70" y="364" font-size="29" fill="#18181b" font-weight="600">一个想法</text><text x="70" y="404" font-size="23" fill="#626269" font-weight="400">“我想做一个产品……”</text><text x="70" y="434" font-size="23" fill="#626269" font-weight="400">从空项目开始</text><path d="M355 365h38" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="414" y="280" width="292" height="172" rx="18" fill="#f5f5f6"/><circle cx="448" cy="315" r="21" fill="#18181b"/><text x="448" y="322" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">2</text><text x="436" y="364" font-size="29" fill="#18181b" font-weight="600">一起讨论</text><text x="436" y="404" font-size="23" fill="#626269" font-weight="400">补证据，比较方案</text><text x="436" y="434" font-size="23" fill="#626269" font-weight="400">重要判断由你确定</text><path d="M721 365h38" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="780" y="280" width="292" height="172" rx="18" fill="#f5f5f6"/><circle cx="814" cy="315" r="21" fill="#18181b"/><text x="814" y="322" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">3</text><text x="802" y="364" font-size="29" fill="#18181b" font-weight="600">独立文档</text><text x="802" y="404" font-size="23" fill="#626269" font-weight="400">确认后再保存</text><text x="802" y="434" font-size="23" fill="#626269" font-weight="400">文件留在自己的电脑</text><path d="M48 481h1024" stroke="#e3e3e7" stroke-width="2" fill="none"/><text x="48" y="524" font-size="25" fill="#18181b" font-weight="500">信息集中</text><text x="48" y="562" font-size="21" fill="#626269" font-weight="400">不用在聊天与文档间来回找</text><text x="414" y="524" font-size="25" fill="#18181b" font-weight="500">依据清楚</text><text x="414" y="562" font-size="21" fill="#626269" font-weight="400">缺什么证据，就先补什么</text><text x="780" y="524" font-size="25" fill="#18181b" font-weight="500">随时接着做</text><text x="780" y="562" font-size="21" fill="#626269" font-weight="400">回到项目，继续讨论和修改</text></g></svg>
