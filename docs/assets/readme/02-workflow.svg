<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="784" viewBox="0 0 1440 784" role="img" aria-labelledby="title desc"><title id="title">从新建项目到保存文档</title><desc id="desc">四个关键动作：新建项目、讨论与补证据、审阅修改、保存独立文档；可以回到项目继续修改。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="784" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">看一遍，就能开始第一份文档</text><text x="64" y="130" font-size="26" fill="#606472" font-weight="400">新建 → 讨论 → 审阅 → 保存</text><circle cx="83" cy="201" r="19" fill="#181a21"/><text x="83" y="208" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">1</text><text x="114" y="211" font-size="29" fill="#181a21" font-weight="600">建一个项目</text><text x="64" y="617" font-size="23" fill="#606472" font-weight="400">一个产品，一个文件夹</text><path d="M353 390h36" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="432" cy="201" r="19" fill="#181a21"/><text x="432" y="208" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">2</text><text x="463" y="211" font-size="29" fill="#181a21" font-weight="600">把问题聊清楚</text><text x="413" y="617" font-size="23" fill="#606472" font-weight="400">补证据，再确认判断</text><path d="M702 390h36" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="781" cy="201" r="19" fill="#181a21"/><text x="781" y="208" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">3</text><text x="812" y="211" font-size="29" fill="#181a21" font-weight="600">审阅拟写入内容</text><text x="762" y="617" font-size="23" fill="#606472" font-weight="400">确认保存，也可以取消</text><path d="M1051 390h36" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1130" cy="201" r="19" fill="#181a21"/><text x="1130" y="208" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">4</text><text x="1161" y="211" font-size="29" fill="#181a21" font-weight="600">留下独立文档</text><text x="1111" y="617" font-size="23" fill="#606472" font-weight="400">文档和讨论一起继续</text><g transform="translate(94 320) scale(0.7846153846153846) rotate(0)"><path d="M6 44Q6 18 32 18H100L126 40H226Q250 40 250 62V218Q250 238 230 238H27Q6 238 6 216Z" fill="url(#black)" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 121Q6 100 27 100H83L105 120H232Q250 120 250 139V218Q250 238 230 238H27Q6 238 6 216Z" fill="url(#glass)" stroke="#c9cedc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="184" font-size="24" fill="#181a21" font-weight="600">旅行计划</text><text x="29" y="214" font-size="16" fill="#606472" font-weight="400">空项目</text></g><rect x="127" y="531" width="134" height="38" rx="19" fill="#181a21"/><text x="194.0" y="557" font-size="21" fill="#fff" font-weight="500" text-anchor="middle">新建项目</text><rect x="431" y="285" width="253" height="72" rx="12" fill="#181a21"/><text x="451" y="317" font-size="21" fill="#fff" font-weight="400">我想梳理旅行规划需求。</text><rect x="431" y="380" width="253" height="101" rx="12" fill="#f4f5f8"/><text x="451" y="412" font-size="21" fill="#181a21" font-weight="400">谁在什么场景下卡住？</text><text x="451" y="446" font-size="21" fill="#181a21" font-weight="400">先找一个真实例子。</text><rect x="454" y="505" width="180" height="38" rx="19" fill="#edf0fc"/><text x="544.0" y="531" font-size="21" fill="#5064b2" font-weight="500" text-anchor="middle">继续补充证据</text><rect x="793" y="283" width="236" height="260" rx="12" fill="#fff" stroke="#e1e4eb" stroke-width="1.5"/><text x="815" y="321" font-size="25" fill="#181a21" font-weight="600">问题定义</text><path d="M815 342H1007" fill="none" stroke="#e1e4eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="815" y="365" width="192" height="36" rx="5" fill="#edf4ef"/><text x="828" y="390" font-size="21" fill="#5b7968" font-weight="400">＋ 已确认的问题</text><rect x="815" y="412" width="192" height="36" rx="5" fill="#f4f5f8"/><text x="828" y="437" font-size="21" fill="#606472" font-weight="400">？ 待验证的假设</text><g transform="translate(817 484) scale(0.96875) rotate(0)"><circle cx="16" cy="16" r="15" fill="#5b7968"/><path d="M9 16l5 5 10-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="860" y="508" font-size="23" fill="#181a21" font-weight="500">确认保存</text><g transform="translate(1146 304) scale(0.8192307692307692) rotate(0)"><path d="M6 44Q6 18 32 18H100L126 40H226Q250 40 250 62V218Q250 238 230 238H27Q6 238 6 216Z" fill="url(#black)" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(55 1) scale(1) rotate(11)"><rect x="0" y="0" width="151" height="205" rx="9" fill="url(#paper)" stroke="#e1e4eb" stroke-width="1.5"/><rect x="20" y="24" width="36" height="5" rx="2" fill="#181a21"/><text x="20" y="66" font-size="22" fill="#181a21" font-weight="600">研究记录</text><rect x="20" y="90" width="107" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="110" width="88" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="130" width="102" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="150" width="64" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="162" width="58" height="22" rx="4" fill="#edf0fc"/><text x="27" y="178" font-size="13" fill="#6d7fd5" font-weight="500">已确认</text></g><g transform="translate(32 -5) scale(1) rotate(-8)"><rect x="0" y="0" width="151" height="205" rx="9" fill="url(#paper)" stroke="#e1e4eb" stroke-width="1.5"/><rect x="20" y="24" width="36" height="5" rx="2" fill="#6d7fd5"/><text x="20" y="66" font-size="22" fill="#181a21" font-weight="600">问题定义</text><rect x="20" y="90" width="107" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="110" width="88" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="130" width="102" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="150" width="64" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="162" width="58" height="22" rx="4" fill="#edf0fc"/><text x="27" y="178" font-size="13" fill="#6d7fd5" font-weight="500">已确认</text></g><path d="M6 121Q6 100 27 100H83L105 120H232Q250 120 250 139V218Q250 238 230 238H27Q6 238 6 216Z" fill="url(#glass)" stroke="#c9cedc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="184" font-size="24" fill="#181a21" font-weight="600">旅行计划助手</text><text x="29" y="214" font-size="16" fill="#606472" font-weight="400">2 份文档</text></g><g transform="translate(1328 511) scale(1.0) rotate(0)"><circle cx="16" cy="16" r="15" fill="#5b7968"/><path d="M9 16l5 5 10-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M1232 653V686Q1232 710 1206 710H228Q194 710 194 679V654" fill="none" stroke="#b5bbc9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 7"/><rect x="478" y="686" width="477" height="38" rx="19" fill="#fff"/><text x="716.5" y="712" font-size="21" fill="#606472" font-weight="500" text-anchor="middle">回到同一项目，继续讨论与修改</text></g></svg>
