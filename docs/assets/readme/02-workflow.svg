<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="678" viewBox="0 0 1120 678" role="img" aria-labelledby="title desc"><title id="title">一次完整的工作流程</title><desc id="desc">新建项目、说明任务、补充证据、审阅修改、保存文档、回来继续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="678" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="45" font-size="18" fill="#626269" font-weight="400">使用流程</text><text x="48" y="98" font-size="40" fill="#18181b" font-weight="600">从一个想法，到一份可用的文档</text><rect x="48" y="140" width="312" height="184" rx="18" fill="#f5f5f6"/><circle cx="82" cy="179" r="21" fill="#18181b"/><text x="82" y="186" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">1</text><text x="70" y="233" font-size="28" fill="#18181b" font-weight="600">新建空项目</text><text x="70" y="271" font-size="23" fill="#626269" font-weight="400">给产品起个名字</text><text x="70" y="301" font-size="23" fill="#626269" font-weight="400">生成真实文件夹</text><path d="M374 230h16" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="404" y="140" width="312" height="184" rx="18" fill="#f5f5f6"/><circle cx="438" cy="179" r="21" fill="#18181b"/><text x="438" y="186" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">2</text><text x="426" y="233" font-size="28" fill="#18181b" font-weight="600">说明真实任务</text><text x="426" y="271" font-size="23" fill="#626269" font-weight="400">谁遇到了什么问题？</text><text x="426" y="301" font-size="23" fill="#626269" font-weight="400">什么结果才算有用？</text><path d="M730 230h16" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="760" y="140" width="312" height="184" rx="18" fill="#f5f5f6"/><circle cx="794" cy="179" r="21" fill="#18181b"/><text x="794" y="186" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">3</text><text x="782" y="233" font-size="28" fill="#18181b" font-weight="600">一起补信息</text><text x="782" y="271" font-size="23" fill="#626269" font-weight="400">调用适用的技能</text><text x="782" y="301" font-size="23" fill="#626269" font-weight="400">比较方案，确认判断</text><rect x="48" y="372" width="312" height="184" rx="18" fill="#f5f5f6"/><circle cx="82" cy="411" r="21" fill="#18181b"/><text x="82" y="418" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">4</text><text x="70" y="465" font-size="28" fill="#18181b" font-weight="600">审阅文件修改</text><text x="70" y="503" font-size="23" fill="#626269" font-weight="400">检查拟写入的内容</text><text x="70" y="533" font-size="23" fill="#626269" font-weight="400">确认保存，或取消</text><path d="M374 462h16" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="404" y="372" width="312" height="184" rx="18" fill="#f5f5f6"/><circle cx="438" cy="411" r="21" fill="#18181b"/><text x="438" y="418" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">5</text><text x="426" y="465" font-size="28" fill="#18181b" font-weight="600">留下独立文档</text><text x="426" y="503" font-size="23" fill="#626269" font-weight="400">文档出现在左侧</text><text x="426" y="533" font-size="23" fill="#626269" font-weight="400">中间打开当前正文</text><path d="M730 462h16" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="760" y="372" width="312" height="184" rx="18" fill="#f5f5f6"/><circle cx="794" cy="411" r="21" fill="#18181b"/><text x="794" y="418" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">6</text><text x="782" y="465" font-size="28" fill="#18181b" font-weight="600">回来继续做</text><text x="782" y="503" font-size="23" fill="#626269" font-weight="400">恢复项目里的对话</text><text x="782" y="533" font-size="23" fill="#626269" font-weight="400">接着补证据、改文档</text><path d="M1070 230h22v119H30v112h8" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="592" width="1024" height="52" rx="12" fill="#e5ebe7"/><text x="560" y="626" font-size="24" fill="#18181b" font-weight="500" text-anchor="middle">先把问题与证据聊清楚，再记录已经确认的结论。</text></g></svg>
