<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="667" viewBox="0 0 1120 667" role="img" aria-labelledby="title desc"><title id="title">文件和服务在哪里</title><desc id="desc">文档、技能和会话存储在本机。模型调用把选定的对话上下文发送给配置的模型服务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="667" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="45" font-size="18" fill="#626269" font-weight="400">文件与服务</text><text x="48" y="98" font-size="40" fill="#18181b" font-weight="600">你的文档在本机，模型通过网络调用</text><rect x="48" y="142" width="697" height="393" rx="20" fill="#f5f5f6"/><text x="73" y="184" font-size="27" fill="#18181b" font-weight="500">你的电脑</text><rect x="77" y="213" width="289" height="162" rx="13" fill="#fff" stroke="#e3e3e7"/><path d="M98 250 Q98 236 112 236 H127.26 L136.5 254 H163 Q175 254 175 266 V278 Q175 290 163 290 H110 Q98 290 98 278Z" stroke="#18181b" stroke-width="1" fill="#18181b"/><rect x="116" y="244" width="35" height="40" rx="6" fill="#fff" stroke="#e3e3e7"/><path d="M126 262h14m-14 12h1" stroke="#e3e3e7" stroke-width="2" fill="none"/><path d="M98 276 Q98 268 108 268 H124.95 L134.19 280 H165 Q175 280 175 290 V278 Q175 290 163 290 H110 Q98 290 98 278Z" stroke="#c7c7cc" stroke-width="1" fill="url(#glass)"/><text x="192" y="263" font-size="25" fill="#18181b" font-weight="500">项目文件夹</text><text x="98" y="318" font-size="21" fill="#626269" font-weight="400">已确认的文档</text><text x="98" y="346" font-size="21" fill="#626269" font-weight="400">普通文本文件，可独立阅读</text><rect x="390" y="213" width="325" height="162" rx="13" fill="#fff" stroke="#e3e3e7"/><text x="414" y="258" font-size="25" fill="#18181b" font-weight="500">桌面存储</text><text x="414" y="307" font-size="21" fill="#626269" font-weight="400">会话历史与模型凭据</text><text x="414" y="337" font-size="21" fill="#626269" font-weight="400">与项目文档分开保存</text><rect x="77" y="399" width="638" height="106" rx="14" fill="#18181b"/><text x="102" y="442" font-size="25" fill="#fff" font-weight="500">工作台 ＋ 现有助手 ＋ 产品方法技能</text><text x="102" y="478" font-size="21" fill="#d7d7dd" font-weight="400">讨论、审阅与文件管理，在这个本地应用里完成。</text><rect x="819" y="226" width="253" height="187" rx="19" fill="#e5ebe7"/><text x="845" y="270" font-size="27" fill="#18181b" font-weight="500">模型服务</text><text x="845" y="315" font-size="23" fill="#18181b" font-weight="400">接收本次选定的</text><text x="845" y="347" font-size="23" fill="#18181b" font-weight="400">对话上下文</text><text x="845" y="379" font-size="23" fill="#18181b" font-weight="400">返回模型回答</text><path d="M752 303h56" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M808 363h-56" stroke="#99999f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="780" y="277" font-size="18" fill="#626269" font-weight="400" text-anchor="middle">网络</text><text x="48" y="579" font-size="24" fill="#18181b" font-weight="500">备份：项目文件夹 ＋ 桌面存储，才能同时保留文档和聊天历史。</text><text x="48" y="623" font-size="22" fill="#626269" font-weight="400">公开的是平台源码和技能；个人项目、会话、凭据与本地构建产物不进入仓库。</text></g></svg>
