<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="826" viewBox="0 0 1440 826" role="img" aria-labelledby="title desc"><title id="title">本机数据与模型服务</title><desc id="desc">本机保存项目文档和桌面存储，网络把选定对话上下文发送给模型；文档与会话需要分别备份。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="826" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">文件留在本机，模型通过网络调用</text><text x="64" y="130" font-size="26" fill="#606472" font-weight="400">文档与聊天历史分开保存，备份时需要保留两份</text><rect x="83" y="215" width="762" height="389" rx="16" fill="#fff" stroke="#181a21" stroke-width="1.5"/><rect x="98" y="230" width="732" height="359" rx="10" fill="#f4f5f8"/><path d="M52 618H876L899 640Q900 655 876 655H58Q35 655 35 640Z" fill="#e9ecf3" stroke="#e1e4eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="379" y="617" width="166" height="11" rx="4" fill="#cdd2de"/><text x="135" y="278" font-size="29" fill="#181a21" font-weight="600">你的电脑</text><g transform="translate(169 335) scale(0.8346153846153846) rotate(0)"><path d="M6 44Q6 18 32 18H100L126 40H226Q250 40 250 62V218Q250 238 230 238H27Q6 238 6 216Z" fill="url(#black)" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(55 1) scale(1) rotate(11)"><rect x="0" y="0" width="151" height="205" rx="9" fill="url(#paper)" stroke="#e1e4eb" stroke-width="1.5"/><rect x="20" y="24" width="36" height="5" rx="2" fill="#181a21"/><text x="20" y="66" font-size="22" fill="#181a21" font-weight="600">研究记录</text><rect x="20" y="90" width="107" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="110" width="88" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="130" width="102" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="150" width="64" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="162" width="58" height="22" rx="4" fill="#edf0fc"/><text x="27" y="178" font-size="13" fill="#6d7fd5" font-weight="500">已确认</text></g><g transform="translate(32 -5) scale(1) rotate(-8)"><rect x="0" y="0" width="151" height="205" rx="9" fill="url(#paper)" stroke="#e1e4eb" stroke-width="1.5"/><rect x="20" y="24" width="36" height="5" rx="2" fill="#6d7fd5"/><text x="20" y="66" font-size="22" fill="#181a21" font-weight="600">问题定义</text><rect x="20" y="90" width="107" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="110" width="88" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="130" width="102" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="150" width="64" height="4" rx="2" fill="#e1e4eb"/><rect x="20" y="162" width="58" height="22" rx="4" fill="#edf0fc"/><text x="27" y="178" font-size="13" fill="#6d7fd5" font-weight="500">已确认</text></g><path d="M6 121Q6 100 27 100H83L105 120H232Q250 120 250 139V218Q250 238 230 238H27Q6 238 6 216Z" fill="url(#glass)" stroke="#c9cedc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="184" font-size="24" fill="#181a21" font-weight="600">项目文档</text><text x="29" y="214" font-size="16" fill="#606472" font-weight="400">2 份文档</text></g><text x="219" y="575" font-size="22" fill="#606472" font-weight="400">普通文本，可独立阅读</text><rect x="477" y="332" width="291" height="192" rx="12" fill="#fff" stroke="#e1e4eb" stroke-width="1.5"/><g transform="translate(500 356) scale(1.34375) rotate(0)"><pat