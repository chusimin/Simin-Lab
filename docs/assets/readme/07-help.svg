<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">遇到问题怎么处理</title><desc id="desc">启动缺产物时先构建，macOS等待时检查权限提示，模型请求失败时检查凭据与网络。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="370" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="45" font-size="18" fill="#626269" font-weight="400">问题速查</text><text x="48" y="98" font-size="40" fill="#18181b" font-weight="600">卡在哪一步，就检查哪一处</text><rect x="48" y="145" width="312" height="184" rx="18" fill="#f5f5f6"/><text x="69" y="187" font-size="25" fill="#18181b" font-weight="500">提示缺少构建产物</text><path d="M70 204h268" stroke="#e3e3e7" stroke-width="1" fill="none"/><text x="69" y="247" font-size="24" fill="#18181b" font-weight="500">重新构建平台</text><text x="69" y="289" font-size="21" fill="#626269" font-weight="400">然后启动桌面应用</text><rect x="404" y="145" width="312" height="184" rx="18" fill="#f5f5f6"/><text x="425" y="187" font-size="25" fill="#18181b" font-weight="500">启动一直等待</text><path d="M426 204h268" stroke="#e3e3e7" stroke-width="1" fill="none"/><text x="425" y="247" font-size="24" fill="#18181b" font-weight="500">查看系统权限提示</text><text x="425" y="289" font-size="21" fill="#626269" font-weight="400">按需要允许访问文件夹</text><rect x="760" y="145" width="312" height="184" rx="18" fill="#f5f5f6"/><text x="781" y="187" font-size="25" fill="#18181b" font-weight="500">模型请求失败</text><path d="M782 204h268" stroke="#e3e3e7" stroke-width="1" fill="none"/><text x="781" y="247" font-size="24" fill="#18181b" font-weight="500">检查凭据与连接</text><text x="781" y="289" font-size="21" fill="#626269" font-weight="400">确认模型服务和网络可用</text></g></svg>
