<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="652" viewBox="0 0 1440 652" role="img" aria-labelledby="title desc"><title id="title">问题与对应处理动作</title><desc id="desc">缺构建产物时重新构建，启动等待时检查系统文件夹权限，模型失败时检查凭据与网络。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="652" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">遇到问题，找到对应的检查动作</text><circle cx="116" cy="204" r="39" fill="#f4f5f8"/><g transform="translate(96 184) scale(1.25) rotate(0)"><path d="M18 3Q32-2 31 12L22 20 9 32 1 24 14 12Q12 7 14 3L20 9 25 5Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="214" font-size="30" fill="#181a21" font-weight="500">缺少构建产物</text><path d="M497 204H689" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="755" cy="204" r="32" fill="#edf0fc"/><g transform="translate(739 188) scale(1.0) rotate(0)"><rect x="1" y="3" width="30" height="26" rx="4" fill="#6d7fd5"/><path d="M7 10l6 6-6 6M17 22H25" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="817" y="206" font-size="30" fill="#181a21" font-weight="600">重新构建平台</text><text x="817" y="250" font-size="25" fill="#606472" font-weight="400">构建完成后，再启动桌面应用</text><path d="M64 286H1376" fill="none" stroke="#e1e4eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="116" cy="360" r="39" fill="#f4f5f8"/><g transform="translate(96 340) scale(1.25) rotate(0)"><path d="M8 14V9Q8 1 16 1Q24 1 24 9V14" fill="none" stroke="#181a21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="12" width="26" height="19" rx="4" fill="#181a21"/><circle cx="16" cy="21" r="3" fill="#fff"/><path d="M16 21V26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="370" font-size="30" fill="#181a21" font-weight="500">启动一直等待</text><path d="M497 360H689" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="755" cy="360" r="32" fill="#edf0fc"/><g transform="translate(739 344) scale(1.0) rotate(0)"><path d="M2 8Q2 4 6 4H13L17 9H27Q30 9 30 12V25Q30 28 27 28H5Q2 28 2 25Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12H29" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="817" y="362" font-size="30" fill="#181a21" font-weight="600">查看系统权限提示</text><text x="817" y="406" font-size="25" fill="#606472" font-weight="400">按需要允许应用访问项目文件夹</text><path d="M64 442H1376" fill="none" stroke="#e1e4eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="116" cy="516" r="39" fill="#f4f5f8"/><g transform="translate(96 496) scale(1.25) rotate(0)"><circle cx="11" cy="11" r="9" fill="#181a21"/><path d="M16 17l14 14h-8v-6h-6Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" fill="#fff"/></g><text x="184" y="526" font-size="30" fill="#181a21" font-weight="500">模型请求失败</text><path d="M497 516H689" fill="none" stroke="#9299aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="755" cy="516" r="32" fill="#edf0fc"/><g transform="translate(739 500) scale(1.0) rotate(0)"><path d="M8 25C-3 24-1 10 9 12C9-4 31-2 28 13C38 14 37 26 29 25Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="817" y="518" font-size="30" fill="#181a21" font-weight="600">检查模型凭据与连接</text><text x="817" y="562" font-size="25" fill="#606472" font-weight="400">确认模型服务与网络可用</text></g></svg>
