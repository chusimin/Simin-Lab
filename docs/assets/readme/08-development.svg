<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="783" viewBox="0 0 1440 783" role="img" aria-labelledby="title desc"><title id="title">平台组成和来源</title><desc id="desc">桌面外壳管理本地服务，工作台展示项目与文档，现有助手处理对话和工具并调用产品方法。平台基于 DeepSeek Harness。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="783" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">工作台、助手和技能，怎样连在一起</text><text x="64" y="130" font-size="26" fill="#606472" font-weight="400">基于 DeepSeek Harness，沿用现有对话与助手能力</text><rect x="64" y="216" width="858" height="345" rx="14" fill="#fff" stroke="#181a21" stroke-width="1.5"/><rect x="65" y="217" width="856" height="56" rx="13" fill="#f4f5f8"/><g transform="translate(85 230) scale(0.875) rotate(0)"><path d="M16 1l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="133" y="255" font-size="26" fill="#181a21" font-weight="600">桌面应用</text><text x="617" y="253" font-size="21" fill="#606472" font-weight="400">管理本地服务的启动与关闭</text><circle cx="199" cy="352" r="47" fill="#f4f5f8"/><g transform="translate(175 328) scale(1.5) rotate(0)"><path d="M1 14L16 2 31 14H27V30H20V20H12V30H5V14Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="