<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="992" viewBox="0 0 1440 992" role="img" aria-labelledby="title desc"><title id="title">项目工作区示意</title><desc id="desc">左侧选择真实文档，中间阅读和编辑正文，右侧与助手讨论。界面和内容为虚构示意。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#9299aa" stroke-width="1.5" stroke-linejoin="round"/></marker><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#dfe4ef" stop-opacity=".68"/></linearGradient><linearGradient id="black" x2="0" y2="1"><stop stop-color="#393d4a"/><stop offset="1" stop-color="#171921"/></linearGradient><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f3f8"/></linearGradient></defs><rect width="1440" height="992" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="85" font-size="46" fill="#181a21" font-weight="600">文档和对话，在同一个视线里</text><text x="64" y="130" font-size="26" fill="#606472" font-weight="400">左侧选文档，中间看正文，右侧继续讨论</text><circle cx="126" cy="202" r="19" fill="#181a21"/><text x="126" y="209" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">1</text><text x="159" y="212" font-size="28" fill="#181a21" font-weight="500">选文档</text><path d="M208 227V253" fill="none" stroke="#e1e4eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="630" cy="202" r="19" fill="#181a21"/><text x="630" y="209" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">2</text><text x="663" y="212" font-size="28" fill="#181a21" font-weight="500">读正文</text><path d="M712 227V253" fill="none" stroke="#e1e4eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1113" cy="202" r="19" fill="#181a21"/><text x="1113" y="209" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">3</text><text x="1146" y="212" font-size="28" fill="#181a21" font-weight="500">和助手聊</text><path d="M1195 227V253" fill="none" stroke="#e1e4eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="266" width="1312" height="579" rx="14" fill="#fff" stroke="#e1e4eb" stroke-width="1.5"/><rect x="65" y="267" width="1310" height="48" rx="13" fill="#f4f5f8"/><path d="M64 314H1376" fill="none" stroke="#e1e4eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="291" r="6" fill="#edb2ad"/><circle cx="110" cy="291" r="6" fill="#ead19f"/><circle cx="133" cy="291" r="6" fill="#aec9b2"/><text x="671" y="299" font-size="18" fill="#606472" font-weight="500" text-anchor="middle">Simin Lab</text><rect x="1208" y="276" width="147" height="38" rx="19" fill="#fff"/><text x="1281.5" y="302" font-size="21" fill="#606472" font-weight="500" text-anchor="middle">项目工作区</text><rect x="65" y="315" width="66" height="529" rx="0" fill="#f7f8fa"/><path d="M131 315V845M355 315V845M884 315V845" fill="none" stroke="#e1e4eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(85 346) scale(0.8125) rotate(0)"><path d="M1 14L16 2 31 14H27V30H20V20H12V30H5V14Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(85 406) scale(0.8125) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(85 466) scale(0.8125) rotate(0)"><circle cx="14" cy="13" r="9" fill="none" stroke="#606472"/><path d="M21 21l8 8" fill="none" stroke="#606472" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(85 786) scale(0.8125) rotate(0)"><path d="M13 1H19L20 6 24 8 28 6 31 11 27 15V19L31 23 28 28 24 26 20 28 19 32H13L12 28 8 26 4 28 1 23 5 19V15L1 11 4 6 8 8 12 6Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="5" fill="#fff"/></g><g transform="translate(154 344) scale(0.71875) rotate(0)"><path d="M2 8Q2 4 6 4H13L17 9H27Q30 9 30 12V25Q30 28 27 28H5Q2 28 2 25Z" fill="#181a21" stroke="#181a21" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12H29" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="187" y="364" font-size="23" fill="#181a21" font-weight="500">旅行计划助手</text><rect x="144" y="408" width="197" height="44" rx="6" fill="#edf0fc"/><g transform="translate(159 418) scale(0.625) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="189" y="438" font-size="22" fill="#181a21" font-weight="500">问题定义</text><g transform="translate(159 470) scale(0.625) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="189" y="490" font-size="22" fill="#606472" font-weight="400">研究记录</text><g transform="translate(159 523) scale(0.625) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="189" y="543" font-size="22" fill="#606472" font-weight="400">待补信息</text><text x="393" y="366" font-size="31" fill="#181a21" font-weight="600">问题定义</text><rect x="741" y="337" width="107" height="38" rx="19" fill="#edf4ef"/><text x="794.5" y="363" font-size="21" fill="#5b7968" font-weight="500" text-anchor="middle">已保存</text><path d="M391 387H848" fill="none" stroke="#e1e4eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="393" y="443" font-size="28" fill="#181a21" font-weight="600">谁遇到了什么问题？</text><text x="393" y="491" font-size="23" fill="#181a21" font-weight="400">多人一起规划短途旅行，</text><text x="393" y="527" font-size="23" fill="#181a21" font-weight="400">行程信息散落在聊天消息中。</text><rect x="393" y="568" width="3" height="114" rx="1" fill="#6d7fd5"/><text x="413" y="595" font-size="24" fill="#181a21" font-weight="600">关键判断</text><text x="413" y="634" font-size="23" fill="#606472" font-weight="400">先找到一次真实的规划经历，</text><text x="413" y="670" font-size="23" fill="#606472" font-weight="400">确认最容易卡住的环节。</text><text x="393" y="735" font-size="27" fill="#181a21" font-weight="600">哪些内容还要验证？</text><text x="393" y="778" font-size="23" fill="#606472" font-weight="400">第一份计划，怎样才算有用？</text><rect x="979" y="345" width="362" height="87" rx="12" fill="#181a21"/><text x="999" y="377" font-size="22" fill="#fff" font-weight="400">先把这个问题聊清楚，</text><text x="999" y="411" font-size="22" fill="#fff" font-weight="400">再决定应该做什么。</text><g transform="translate(912 464) scale(0.75) rotate(0)"><path d="M16 1l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z" fill="#6d7fd5" stroke="#6d7fd5" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="950" y="486" font-size="23" fill="#181a21" font-weight="400">我们从一次真实经历开始。</text><text x="950" y="524" font-size="23" fill="#181a21" font-weight="400">当时是谁在计划旅行？</text><text x="950" y="562" font-size="23" fill="#181a21" font-weight="400">具体卡在了哪一步？</text><rect x="912" y="625" width="428" height="71" rx="8" fill="#edf4ef"/><g transform="translate(930 645) scale(0.90625) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#5b7968" stroke="#5b7968" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="975" y="654" font-size="22" fill="#181a21" font-weight="500">准备保存：问题定义</text><text x="975" y="683" font-size="19" fill="#5b7968" font-weight="400">审阅内容后确认写入</text><rect x="911" y="730" width="431" height="83" rx="10" fill="#fff" stroke="#e1e4eb" stroke-width="1.5"/><text x="931" y="765" font-size="22" fill="#606472" font-weight="400">继续讨论……</text><rect x="1290" y="749" width="36" height="36" rx="10" fill="#181a21"/><path d="M1308 775V758m-6 6 6-6 6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(112 886) scale(0.8125) rotate(0)"><path d="M1 14L16 2 31 14H27V30H20V20H12V30H5V14Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><text x="151" y="908" font-size="23" fill="#606472" font-weight="400">首页</text><g transform="translate(328 886) scale(0.8125) rotate(0)"><path d="M8 2H21L28 9V28Q28 30 26 30H8Q5 30 5 27V5Q5 2 8 2Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 2V10H28M11 16H22M11 22H22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="367" y="908" font-size="23" fill="#606472" font-weight="400">文档</text><g transform="translate(544 886) scale(0.8125) rotate(0)"><circle cx="14" cy="13" r="9" fill="none" stroke="#606472"/><path d="M21 21l8 8" fill="none" stroke="#606472" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="583" y="908" font-size="23" fill="#606472" font-weight="400">搜索</text><g transform="translate(760 886) scale(0.8125) rotate(0)"><path d="M5 4H27Q30 4 30 7V23Q30 26 27 26H13L6 31V26H5Q2 26 2 23V7Q2 4 5 4Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 11H24M9 17H20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="799" y="908" font-size="23" fill="#606472" font-weight="400">讨论起点</text><g transform="translate(976 886) scale(0.8125) rotate(0)"><path d="M7 8H26L24 29H9Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 5H29M11 2H22" fill="none" stroke="#606472" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 13V23M20 13V23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1015" y="908" font-size="23" fill="#606472" font-weight="400">回收站</text><g transform="translate(1192 886) scale(0.8125) rotate(0)"><path d="M13 1H19L20 6 24 8 28 6 31 11 27 15V19L31 23 28 28 24 26 20 28 19 32H13L12 28 8 26 4 28 1 23 5 19V15L1 11 4 6 8 8 12 6Z" fill="#606472" stroke="#606472" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="5" fill="#fff"/></g><text x="1231" y="908" font-size="23" fill="#606472" font-weight="400">设置</text><text x="1374" y="964" font-size="20" fill="#606472" font-weight="400" text-anchor="end">界面示意，使用虚构样例</text></g></svg>
