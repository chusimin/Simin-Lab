<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="772" viewBox="0 0 1120 772" role="img" aria-labelledby="title desc"><title id="title">工作区怎么看</title><desc id="desc">左边选文档，中间读正文，右边与现有助手讨论。下方列出全局页面入口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99999f"/></marker><linearGradient id="glass"><stop stop-color="#fff" stop-opacity=".76"/><stop offset="1" stop-color="#fff" stop-opacity=".56"/></linearGradient></defs><rect width="1120" height="772" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="45" font-size="18" fill="#626269" font-weight="400">界面地图</text><text x="48" y="98" font-size="40" fill="#18181b" font-weight="600">文档和讨论，放在同一个项目里</text><rect x="48" y="141" width="1024" height="386" rx="14" fill="#fff" stroke="#e3e3e7"/><rect x="49" y="142" width="189" height="384" rx="13" fill="#fafafa"/><path d="M238 142v384M636 142v384M238 193h833" stroke="#e3e3e7" stroke-width="1" fill="none"/><text x="66" y="176" font-size="22" fill="#18181b" font-weight="500">旅行计划助手</text><text x="260" y="176" font-size="22" fill="#18181b" font-weight="500">问题定义</text><rect x="61" y="219" width="163" height="38" rx="6" fill="#eeeeef"/><text x="76" y="245" font-size="21" fill="#18181b" font-weight="400">问题定义</text><text x="76" y="291" font-size="21" fill="#626269" font-weight="400">研究记录</text><text x="76" y="332" font-size="21" fill="#626269" font-weight="400">待补信息</text><text x="270" y="241" font-size="24" fill="#18181b" font-weight="600">谁在什么场景下遇到问题？</text><text x="270" y="284" font-size="20" fill="#626269" font-weight="400">多人一起规划短途旅行。</text><text x="270" y="316" font-size="20" fill="#626269" font-weight="400">行程信息散落在聊天消息中。</text><path d="M270 344h334" stroke="#e3e3e7" stroke-width="1" fill="none"/><text x="270" y="386" font-size="23" fill="#18181b" font-weight="500">哪些内容还要验证？</text><text x="270" y="425" font-size="20" fill="#626269" font-weight="400">最容易卡住的环节是什么？</text><text x="270" y="457" font-size="20" fill="#626269" font-weight="400">第一份计划怎样才算有用？</text><rect x="719" y="217" width="327" height="74" rx="12" fill="#f5f5f6"/><text x="737" y="246" font-size="20" fill="#18181b" font-weight="400">先把这个问题聊清楚，</text><text x="737" y="272" font-size="20" fill="#18181b" font-weight="400">再决定应该做什么。</text><text x="658" y="334" font-size="20" fill="#18181b" font-weight="400">我们先从一个真实例子开始。</text><text x="658" y="364" font-size="20" fill="#18181b" font-weight="400">当时是谁在计划旅行？</text><text x="658" y="394" font-size="20" fill="#18181b" font-weight="400">具体卡在了哪一步？</text><rect x="655" y="442" width="394" height="58" rx="12" fill="#fff" stroke="#d7d7dc"/><text x="673" y="477" font-size="20" fill="#99999f" font-weight="400">继续讨论……</text><rect x="1006" y="455" width="32" height="32" rx="9" fill="#18181b"/><path d="M1022 477v-13m-5 5 5-5 5 5" stroke="#fff" stroke-width="2" fill="none"/><circle cx="71" cy="567" r="21" fill="#18181b"/><text x="71" y="574" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">1</text><text x="103" y="575" font-size="26" fill="#18181b" font-weight="500">选文档</text><text x="48" y="617" font-size="21" fill="#626269" font-weight="400">同一项目里的真实文件</text><circle cx="415" cy="567" r="21" fill="#18181b"/><text x="415" y="574" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">2</text><text x="447" y="575" font-size="26" fill="#18181b" font-weight="500">读正文</text><text x="392" y="617" font-size="21" fill="#626269" font-weight="400">阅读、编辑、复制、专注</text><circle cx="759" cy="567" r="21" fill="#18181b"/><text x="759" y="574" font-size="22" fill="#fff" font-weight="500" text-anchor="middle">3</text><text x="791" y="575" font-size="26" fill="#18181b" font-weight="500">和助手聊</text><text x="736" y="617" font-size="21" fill="#626269" font-weight="400">讨论后审阅，再确认保存</text><text x="48" y="683" font-size="23" fill="#18181b" font-weight="500">全局入口</text><rect x="48" y="706" width="152" height="39" rx="10" fill="#f5f5f6"/><text x="124" y="733" font-size="20" fill="#18181b" font-weight="400" text-anchor="middle">项目首页</text><rect x="222" y="706" width="152" height="39" rx="10" fill="#f5f5f6"/><text x="298" y="733" font-size="20" fill="#18181b" font-weight="400" text-anchor="middle">全部文档</text><rect x="396" y="706" width="152" height="39" rx="10" fill="#f5f5f6"/><text x="472" y="733" font-size="20" fill="#18181b" font-weight="400" text-anchor="middle">搜索</text><rect x="570" y="706" width="152" height="39" rx="10" fill="#f5f5f6"/><text x="646" y="733" font-size="20" fill="#18181b" font-weight="400" text-anchor="middle">讨论起点</text><rect x="744" y="706" width="152" height="39" rx="10" fill="#f5f5f6"/><text x="820" y="733" font-size="20" fill="#18181b" font-weight="400" text-anchor="middle">回收站</text><rect x="918" y="706" width="152" height="39" rx="10" fill="#f5f5f6"/><text x="994" y="733" font-size="20" fill="#18181b" font-weight="400" text-anchor="middle">设置</text><text x="1069" y="121" font-size="16" fill="#626269" font-weight="400" text-anchor="end">界面示意 · 虚构样例</text></g></svg>
